[project]
name = "Synthetic SciELO Articles"

[xml]
catalog = "catalog.xml"

[validation]
framework = "SPS-1.10"

[transform]
default = "jats-html-libxslt"

[[transform.scenarios]]
name = "jats-html-libxslt"
engine = "libxslt"
stylesheet = "xslt/jats-html.xsl"
output = "output/article-libxslt.html"
media_type = "html"

[[transform.scenarios]]
name = "jats-html-saxon"
engine = "saxon-he"
stylesheet = "xslt/jats-html.xsl"
output = "output/article-saxon.html"
media_type = "html"
