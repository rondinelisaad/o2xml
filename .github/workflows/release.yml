name: Build installers

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: o2xml-release
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxml2-dev \
            libxslt1-dev \
            pkg-config \
            patchelf

      - name: Prepare XML helper for workspace checks
        run: |
          cargo build --locked --package xml-libxml2-helper
          node app/scripts/stage-sidecar.mjs "$(rustc --print host-tuple)" debug

      - name: Test Rust workspace
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      - name: Test frontend
        working-directory: app
        run: |
          npm ci
          npm run test:i18n
          npm run build

  prepare-release:
    name: Prepare draft release
    needs: quality
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create or reuse one draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          version=$(jq -r '.version' app/src-tauri/tauri.conf.json)
          tag="o2xml-v${version}"
          name="O2XML v${version}"
          body=$'Instaladores multiplataforma e pacote portátil do O2XML.\n\nEsta release permanece como rascunho até os smoke tests dos artefatos.'
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          release_id=$(printf '%s' "$releases" | jq -r --arg tag "$tag" \
            '[.[] | select(.draft and .tag_name == $tag)] | sort_by(.id) | first | .id // empty')
          if [[ -n "$release_id" ]]; then
            release_id=$(gh api --method PATCH \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$name" \
              -f body="$body" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')
          else
            payload=$(jq -n \
              --arg tag "$tag" \
              --arg target "$GITHUB_SHA" \
              --arg name "$name" \
              --arg body "$body" \
              '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: true, prerelease: false, generate_release_notes: true}')
            release_id=$(printf '%s' "$payload" | gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" --input - --jq '.id')
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag}" >> "$GITHUB_OUTPUT"

  installers:
    name: ${{ matrix.name }}
    needs: [quality, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxml2-dev \
            libxslt1-dev \
            pkg-config \
            patchelf

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install pkg-config libxml2 libxslt

      - name: Configure macOS pkg-config
        if: runner.os == 'macOS'
        run: |
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libxslt)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install Windows native dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            "libxml2:x64-windows-static-md" `
            "libxslt:x64-windows-static-md"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -Append -FilePath $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=x64-windows-static-md" | Out-File -Append -FilePath $env:GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Verify native runner target
        shell: bash
        run: test "$(rustc --print host-tuple)" = "${{ matrix.target }}"

      - name: Build isolated XML helper on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          O2XML_STATIC_XML_LIBS=1 cargo build \
            --locked \
            --release \
            --package xml-libxml2-helper \
            --target "${{ matrix.target }}"
          node app/scripts/stage-sidecar.mjs "${{ matrix.target }}"

      - name: Build isolated XML helper on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build `
            --locked `
            --release `
            --package xml-libxml2-helper `
            --target "${{ matrix.target }}"
          node app/scripts/stage-sidecar.mjs "${{ matrix.target }}"

      - name: Build installers and create draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        with:
          projectPath: app
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseDraft: true
          prerelease: false
          args: >-
            --target ${{ matrix.target }}
            --bundles ${{ matrix.bundles }}

      - name: Create Windows portable archive
        if: runner.os == 'Windows'
        id: portable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content "app/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid application version: $version"
          }

          $releaseDirectory = Join-Path "target" "${{ matrix.target }}" "release"
          $application = Join-Path $releaseDirectory "o2xml-desktop.exe"
          $helper = Join-Path $releaseDirectory "xml-libxml2-helper.exe"
          if (-not (Test-Path $application -PathType Leaf)) {
            throw "Portable application executable was not produced: $application"
          }
          if (-not (Test-Path $helper -PathType Leaf)) {
            throw "Portable XML helper was not produced: $helper"
          }

          $portableName = "O2XML-$version-windows-x64-portable"
          $portableRoot = Join-Path $env:RUNNER_TEMP $portableName
          $resourceRoot = Join-Path $portableRoot "resources"
          New-Item -ItemType Directory -Force -Path $resourceRoot | Out-Null
          Copy-Item $application (Join-Path $portableRoot "O2XML.exe")
          Copy-Item $helper (Join-Path $portableRoot "xml-libxml2-helper.exe")
          Copy-Item "app/src-tauri/resources/jats" (Join-Path $resourceRoot "jats") -Recurse
          Copy-Item "app/src-tauri/resources/packtools-html" (Join-Path $resourceRoot "packtools-html") -Recurse
          Copy-Item "packaging/windows/README-PORTABLE.txt" $portableRoot
          Copy-Item "LICENSE-MIT" $portableRoot
          Copy-Item "LICENSE-APACHE" $portableRoot
          Copy-Item "DEPENDENCIES.md" $portableRoot

          $requiredFiles = @(
            (Join-Path $portableRoot "O2XML.exe"),
            (Join-Path $portableRoot "xml-libxml2-helper.exe"),
            (Join-Path $resourceRoot "jats/1.1/JATS-journalpublishing1.dtd"),
            (Join-Path $resourceRoot "packtools-html/4.16.9/catalog.xml")
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path $requiredFile -PathType Leaf)) {
              throw "Portable package is incomplete: $requiredFile"
            }
          }

          $archive = Join-Path $env:RUNNER_TEMP "$portableName.zip"
          Compress-Archive -Path $portableRoot -DestinationPath $archive -CompressionLevel Optimal
          $archiveInfo = Get-Item $archive
          if ($archiveInfo.Length -le 0) {
            throw "Portable archive is empty"
          }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = "$archive.sha256"
          "$hash  $($archiveInfo.Name)" | Set-Content $checksum -Encoding ascii -NoNewline
          "archive=$archive" | Out-File -Append -FilePath $env:GITHUB_OUTPUT
          "checksum=$checksum" | Out-File -Append -FilePath $env:GITHUB_OUTPUT

      - name: Upload Windows portable archive to draft release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare-release.outputs.tag_name }}" `
            "${{ steps.portable.outputs.archive }}" `
            "${{ steps.portable.outputs.checksum }}" `
            --clobber
