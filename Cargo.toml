[workspace]
members = [
    "crates/xml-domain",
    "crates/xml-document",
    "crates/xml-diff",
    "crates/xml-dtd",
    "crates/xml-author",
    "crates/xml-framework",
    "crates/xml-grid",
    "crates/xml-jats",
    "crates/xml-libxml2-helper",
    "crates/xml-plugin-api",
    "crates/xml-project",
    "crates/xml-resource",
    "crates/xml-schema",
    "crates/xml-schematron",
    "crates/xml-syntax",
    "crates/xml-transform",
    "crates/xml-validation",
    "crates/xml-xsd",
    "crates/xml-xpath",
    "app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scieloorg/o2xml"

[workspace.dependencies]
anyhow = "1"
quick-xml = "0.40"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
pkg-config = "0.3"
vcpkg = "0.2"
tauri = "2"
tauri-plugin-dialog = "2"
tempfile = "3.27"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.53.3", features = ["io-util", "net", "process", "rt", "time"] }
url = "2.5.8"
wasmtime = { version = "48.0.6", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wat = "1.254.0"
zeroize = "1.9.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
