[package]
name = "o2xml-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "o2xml_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
tauri = { workspace = true, features = [] }
tauri-plugin-dialog.workspace = true
tempfile.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
xml-document = { path = "../../crates/xml-document" }
xml-diff = { path = "../../crates/xml-diff" }
xml-dtd = { path = "../../crates/xml-dtd" }
xml-domain = { path = "../../crates/xml-domain" }
xml-framework = { path = "../../crates/xml-framework" }
xml-jats = { path = "../../crates/xml-jats" }
xml-project = { path = "../../crates/xml-project" }
xml-resource = { path = "../../crates/xml-resource" }
xml-schema = { path = "../../crates/xml-schema" }
xml-schematron = { path = "../../crates/xml-schematron" }
xml-syntax = { path = "../../crates/xml-syntax" }
xml-transform = { path = "../../crates/xml-transform" }
xml-validation = { path = "../../crates/xml-validation" }
xml-xsd = { path = "../../crates/xml-xsd" }
xml-xpath = { path = "../../crates/xml-xpath" }

[lints]
workspace = true
